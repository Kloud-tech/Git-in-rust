[package]
name = "rgit"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
sha1_smol = "1.0"           # SHA-1 simple pour objets Git
flate2 = { version = "1.0", features = ["zlib"] }  # zlib pour objets .git/objects
bytes = "1.6"
walkdir = "2.5"
chrono = { version = "0.4", features = ["clock"] }
sha1 = "0.10.6"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
